<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Orçamentos Zé do Mate</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: cabeçalho fixo, lista de orçamentos à esquerda, abas de trabalho à direita; a folha A4 é a única superfície branca. */
:root{
  --bg:#F5F2FA; --surface:#FFFFFF; --surface2:#EFEAF7; --ink:#1E1233; --muted:#6A6081; --line:#E2DAEF;
  --purple:#5B1AA6; --purple-ink:#5B1AA6; --orange:#F25A0C; --on-purple:#FFFFFF;
  --ok:#17794A; --ok-bg:#DDF3E8; --warn:#9A5B00; --warn-bg:#FFF0CF; --bad:#B3261E; --bad-bg:#FCE3E0; --info-bg:#E9DDFA;
  --paper:#FFFFFF; --paper-ink:#1E1233; --paper-muted:#6A6081; --paper-line:#E2DAEF; --paper-tint:#F6F2FC; --paper-shadow:rgba(30,18,51,.18);
  --f-display:'Bricolage Grotesque','Trebuchet MS',system-ui,sans-serif; --f-body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#140D21; --surface:#1E1530; --surface2:#2A1E42; --ink:#F1EBFB; --muted:#A99EC2; --line:#35284F;
  --purple:#6D2DC4; --purple-ink:#B58CF5; --orange:#FF7A3A; --on-purple:#FFFFFF;
  --ok:#5AD39A; --ok-bg:#12382A; --warn:#F2B64F; --warn-bg:#3B2C0E; --bad:#FF8A80; --bad-bg:#431A18; --info-bg:#32205A;
  --paper-shadow:rgba(0,0,0,.5); color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#140D21; --surface:#1E1530; --surface2:#2A1E42; --ink:#F1EBFB; --muted:#A99EC2; --line:#35284F;
  --purple:#6D2DC4; --purple-ink:#B58CF5; --orange:#FF7A3A; --on-purple:#FFFFFF;
  --ok:#5AD39A; --ok-bg:#12382A; --warn:#F2B64F; --warn-bg:#3B2C0E; --bad:#FF8A80; --bad-bg:#431A18; --info-bg:#32205A;
  --paper-shadow:rgba(0,0,0,.5); color-scheme:dark; }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1240px;margin:0 auto}

/* topo */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px;padding:14px 0}
.brand{display:flex;align-items:center;gap:12px;min-width:0;margin-right:auto}
.brand img{width:44px;height:44px;border-radius:50%;flex:none;background:#fff}
.brand h1{font-size:21px;font-weight:800;letter-spacing:-.01em}
.brand small{display:block;color:var(--muted);font-size:13px}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.savestate{font-size:13px;color:var(--muted);min-width:96px;text-align:right}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;cursor:pointer;font-weight:600;font-size:14px;transition:background .15s,border-color .15s}
.btn:hover{border-color:var(--purple-ink)}
.btn.primary{background:var(--purple);border-color:var(--purple);color:var(--on-purple)}
.btn.primary:hover{filter:brightness(1.1)}
.btn.orange{background:var(--orange);border-color:var(--orange);color:#fff}
.btn.small{padding:5px 10px;font-size:13px;border-radius:8px}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
:focus-visible{outline:2px solid var(--orange);outline-offset:2px}

/* resumo */
.summary{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:8px 0 10px;border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.metric{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 12px;min-width:0}
.metric span{display:block;font-size:12px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.metric b{display:block;font-family:var(--f-display);font-size:20px;font-variant-numeric:tabular-nums;white-space:nowrap}
.metric.hero{background:var(--purple);border-color:var(--purple);color:var(--on-purple)}
.metric.hero span{color:rgba(255,255,255,.78)}
.metric b.good{color:var(--ok)} .metric b.warn{color:var(--warn)} .metric b.bad{color:var(--bad)}
.metric.hero b{color:#fff}
.pill{display:inline-block;border-radius:99px;padding:2px 10px;font-size:12px;font-weight:700;letter-spacing:.02em}
.pill.rascunho{background:var(--surface2);color:var(--muted)}
.pill.enviada{background:var(--info-bg);color:var(--purple-ink)}
.pill.aprovada{background:var(--ok-bg);color:var(--ok)}

/* grade principal */
.layout{display:grid;grid-template-columns:260px minmax(0,1fr);gap:20px;margin-top:16px;align-items:start}
@media (max-width:900px){.layout{grid-template-columns:minmax(0,1fr)}}
.side{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;min-width:0}
.side h2{font-size:15px;margin:2px 4px 8px}
.qlist{display:flex;flex-direction:column;gap:6px;max-height:420px;overflow:auto}
.qitem{display:grid;gap:2px;text-align:left;width:100%;border:1px solid transparent;background:var(--surface2);border-radius:10px;padding:8px 10px;cursor:pointer}
.qitem[aria-current="true"]{border-color:var(--orange)}
.qitem b{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qitem span{font-size:12.5px;color:var(--muted);display:flex;gap:8px;justify-content:space-between;align-items:center}
.qtools{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.empty{color:var(--muted);font-size:13.5px;padding:6px 4px}
.mode{font-size:12px;color:var(--muted);margin:10px 4px 0}

.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;-webkit-overflow-scrolling:touch}
.tab{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:8px 16px;font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.panel[hidden]{display:none}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px;min-width:0}
.card>h3{font-size:17px;margin-bottom:12px;font-weight:800}
.card>h3 small{font-family:var(--f-body);font-weight:500;color:var(--muted);font-size:13px;margin-left:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.grid.c2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.span2{grid-column:1/-1}
.f{display:grid;gap:4px;min-width:0;align-content:start}
.f>span{font-size:13px;color:var(--muted);font-weight:600}
.f input,.f select,.f textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:9px 11px;min-width:0}
.f textarea{min-height:76px;resize:vertical}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--purple-ink);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--purple-ink) 25%,transparent)}
.f small{color:var(--muted);font-size:12.5px}
.chk{display:flex;gap:8px;align-items:center;font-size:14.5px;cursor:pointer}
.chk input{width:18px;height:18px;accent-color:var(--purple)}
.hint{background:var(--surface2);border-radius:10px;padding:8px 12px;font-size:13.5px;color:var(--muted)}
.hint b{color:var(--ink)}
.checks{display:flex;gap:18px;flex-wrap:wrap}

.tablebox{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:520px}
th{font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td input{width:88px;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 8px;text-align:right;font-variant-numeric:tabular-nums}
td input.wide{width:100%;text-align:left}
td input:focus{outline:2px solid var(--purple-ink)}
tr.total td{font-weight:800;border-bottom:none;font-size:15px}
.auto{font-size:11px;color:var(--purple-ink);font-weight:700;margin-left:6px}

.margins{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.mchip{border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 12px;text-align:left;cursor:pointer;display:grid;gap:2px}
.mchip b{font-family:var(--f-display);font-size:19px;font-variant-numeric:tabular-nums}
.mchip span{font-size:12.5px;color:var(--muted)}
.mchip[aria-pressed="true"]{border-color:var(--orange);background:color-mix(in srgb,var(--orange) 10%,var(--bg))}

.extrarow{display:grid;grid-template-columns:minmax(0,1fr) 92px 130px;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.extrarow:last-child{border-bottom:none}
.extrarow .nm{min-width:0}.extrarow .nm small{display:block;color:var(--muted);font-size:12.5px}
.extrarow input{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 9px;text-align:right}
@media (max-width:560px){.extrarow{grid-template-columns:minmax(0,1fr) 80px}.extrarow .pr{grid-column:1/-1}}
.parc{display:grid;grid-template-columns:90px repeat(2,minmax(130px,1fr));gap:10px;align-items:end;margin-bottom:10px}
.parc .lbl{font-weight:700;padding-bottom:9px}
@media (max-width:560px){.parc{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.parc .lbl{grid-column:1/-1;padding-bottom:0}}
.cfgrow{display:grid;grid-template-columns:minmax(0,2fr) 120px 110px 100px 90px 90px auto;gap:8px;align-items:end;padding:10px 0;border-bottom:1px solid var(--line)}
@media (max-width:900px){.cfgrow{grid-template-columns:repeat(2,minmax(0,1fr))}}

.gate{text-align:center;padding:28px 16px}
.gate p{color:var(--muted);max-width:46ch;margin:8px auto 16px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.msg{font-size:13.5px;margin-top:6px}
.msg.warn{color:var(--warn)} .msg.ok{color:var(--ok)}
.missing{background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:8px 12px;font-size:13.5px;margin-bottom:12px}

/* folha A4 (sempre branca, como o PDF) */
.stage{background:var(--surface2);border-radius:14px;padding:16px;overflow:hidden}
.fit{width:100%;position:relative}
.paper{width:794px;transform-origin:0 0;background:var(--paper);color:var(--paper-ink);box-shadow:0 6px 28px var(--paper-shadow);font-family:Helvetica,Arial,sans-serif;font-size:13.4px;line-height:1.5;padding:0 68px 60px;min-height:1123px}
.paper .band{height:11px;background:#F25A0C;margin:0 -68px 0;position:relative}
.paper .band::after{content:"";position:absolute;left:0;top:11px;width:28%;height:5px;background:#5B1AA6}
.pp-brand{display:flex;justify-content:space-between;align-items:flex-start;padding-top:36px;margin-bottom:26px}
.pp-brand img{width:200px;height:auto;display:block}
.pp-brand div{text-align:right;color:var(--paper-muted);font-size:12.5px;line-height:1.5}
.pp-brand div b{display:block;color:#5B1AA6;letter-spacing:.08em;font-size:13px}
.pp-title{font-size:25px;font-weight:700;color:#5B1AA6;line-height:1.2;margin:0 0 4px}
.pp-title.center,.pp-sub.center{text-align:center}
.pp-sub{color:var(--paper-muted);font-size:14px;margin:0 0 8px}
.pp-h{font-weight:700;font-size:15.5px;margin:22px 0 7px;color:#F25A0C}
.pp-h.purple{color:#5B1AA6;font-size:14px;margin-top:18px}
.pp-p{margin:0 0 8px}
.pp-li{display:flex;gap:10px;margin:0 0 3px}
.pp-li::before{content:"•";color:#F25A0C;font-weight:700;flex:none;width:8px}
.pp-kv{display:grid;grid-template-columns:110px 1fr;border-top:1px solid var(--paper-line)}
.pp-kv>*{padding:6px 0;border-bottom:1px solid var(--paper-line)}
.pp-kv>span{color:var(--paper-muted);font-weight:700;font-size:12.5px;text-transform:uppercase;letter-spacing:.05em;padding-top:8px}
.pp-box{background:var(--paper-tint);padding:14px 18px;margin:18px 0 6px}
.pp-box div{display:flex;justify-content:space-between;gap:16px;padding:3px 0}
.pp-box div.big{border-top:1px solid var(--paper-line);margin-top:8px;padding-top:10px;color:#5B1AA6;font-size:23px;font-weight:700}
.pp-note{font-size:12px;color:var(--paper-muted);font-style:italic;margin:8px 0}
.pp-sign{display:grid;grid-template-columns:1fr 1fr;gap:34px 40px;margin-top:40px}
.pp-sign div{border-top:1px solid var(--paper-ink);padding-top:5px;font-size:12px;line-height:1.35}
.pp-sign div b{display:block}
.pp-sp{height:14px}
.pp-small{font-size:12.6px}

.copyarea{width:100%;min-height:170px;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px;font-family:var(--f-body);font-size:14px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const clone=o=>JSON.parse(JSON.stringify(o));
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const getPath=(o,p)=>p.split('.').reduce((a,k)=>a==null?a:a[k],o);
function setPath(o,p,v){const ks=p.split('.');let a=o;for(let i=0;i<ks.length-1;i++){if(a[ks[i]]==null)a[ks[i]]={};a=a[ks[i]];}a[ks[ks.length-1]]=v;}
const num=v=>{const n=typeof v==='number'?v:parseFloat(v);return Number.isFinite(n)?n:0;};
function deepMerge(base,over){if(Array.isArray(base)||typeof base!=='object'||base===null)return over===undefined?base:over;const out={...base};if(over&&typeof over==='object'&&!Array.isArray(over)){for(const k of Object.keys(over)){out[k]=k in base?deepMerge(base[k],over[k]):over[k];}}return out;}
function intPart(n){return String(n).replace(/\B(?=(\d{3})+(?!\d))/g,'.');}
function money(n){n=Math.round(num(n)*100)/100;const neg=n<0;n=Math.abs(n);const [i,d]=n.toFixed(2).split('.');return (neg?'-':'')+'R$ '+intPart(i)+','+d;}
function moneyN(n){n=Math.round(num(n)*100)/100;return Number.isInteger(n)?'R$ '+intPart(n):money(n);}
function qty(n){n=Math.round(num(n)*100)/100;return String(n).replace('.',',');}
const pct=n=>(Math.round(n*1000)/10).toString().replace('.',',')+'%';
const MESES=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
function dateBR(iso){if(!iso)return '';const [y,m,d]=iso.split('-');return `${d}/${m}/${y}`;}
function dateExt(iso){if(!iso)return '';const [y,m,d]=iso.split('-').map(Number);return `${d} de ${MESES[m-1]} de ${y}`;}
function timeFmt(t){if(!t)return '';const [h,m]=t.split(':').map(Number);return m?`${h}h${String(m).padStart(2,'0')}`:`${h}h`;}
function horas(q){const a=q.evento.inicio,b=q.evento.fim;if(!a||!b)return 0;const [h1,m1]=a.split(':').map(Number),[h2,m2]=b.split(':').map(Number);let d=(h2*60+m2)-(h1*60+m1);if(d<0)d+=1440;return d/60;}

const U=['zero','um','dois','três','quatro','cinco','seis','sete','oito','nove','dez','onze','doze','treze','quatorze','quinze','dezesseis','dezessete','dezoito','dezenove'];
const D=['','','vinte','trinta','quarenta','cinquenta','sessenta','setenta','oitenta','noventa'];
const C=['','cento','duzentos','trezentos','quatrocentos','quinhentos','seiscentos','setecentos','oitocentos','novecentos'];
function ate999(n){if(n===100)return 'cem';const c=Math.floor(n/100),r=n%100,p=[];if(c)p.push(C[c]);if(r){if(r<20)p.push(U[r]);else{const d=Math.floor(r/10),u=r%10;p.push(D[d]+(u?' e '+U[u]:''));}}return p.join(' e ');}
function extenso(n,fem){n=Math.floor(num(n));if(n===0)return 'zero';let out=[];const mi=Math.floor(n/1e6),mil=Math.floor((n%1e6)/1000),r=n%1000;
  if(mi)out.push(mi===1?'um milhão':ate999(mi)+' milhões');
  if(mil)out.push(mil===1?'mil':ate999(mil)+' mil');
  if(r)out.push(ate999(r));
  let s='';out.forEach((p,i)=>{if(i===0)s=p;else{const last=i===out.length-1;const rem=r;s+=(last&&(rem<100||rem%100===0)?' e ':' ')+p;}});
  if(out.length>1&&r===0&&mil&&mi)s=s;
  if(fem)s=s.replace(/\bum\b/g,'uma').replace(/\bdois\b/g,'duas').replace(/(\w+)ntos\b/g,'$1ntas');
  return s;}
const nx=(n,fem)=>`${num(n)} (${extenso(n,fem)})`;
function reaisExt(v){v=Math.round(num(v)*100)/100;const r=Math.floor(v),c=Math.round((v-r)*100);let s=extenso(r)+(r===1?' real':' reais');if(c)s+=' e '+extenso(c)+(c===1?' centavo':' centavos');return s;}
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);

  q.proposta={exclusiva:true,obs:'Preço exclusivo para Typo.ag 2º/2026'};
  q.pagamento={n:2,parcelas:[{data:'2026-10-14',ate:''},{data:'2026-10-20',ate:'2026-10-21'}]};
  q.contrato={dataAss:'2026-10-13',cidade:'Santo André/SP'};

/* ============ cálculo ============ */
function calc(q,c){
  const r=c.regras, h=horas(q);
  const conv=num(q.evento.convidados);
  const sugL=conv?Math.ceil(conv*r.consumoL*((h||r.horasBase)/r.horasBase)):0;
  const litrosCha=q.op.litrosCha!=null?num(q.op.litrosCha):Math.ceil(sugL/2);
  const litrosSuco=q.op.litrosSuco!=null?num(q.op.litrosSuco):Math.ceil(sugL/2);
  const copos=q.op.copos!=null?num(q.op.copos):Math.ceil((litrosCha+litrosSuco)*1000/r.mlCopo);
  const autos={litrosCha,litrosSuco,bartenders:num(q.op.bartenders),copos,galoes:num(q.op.galoes)};
  const itens=CUSTOS.map(it=>{
    const def=it.auto?autos[it.auto]:(c.qtdPadrao[it.k]??0);
    const ov=q.qtd[it.k];
    const qt=ov!=null&&ov!==''?num(ov):def;
    const unit=num(c.precos[it.k]);
    return {...it,def,qtd:qt,unit,total:qt*unit,manual:ov!=null&&ov!==''};
  });
  const custoItens=itens.reduce((a,i)=>a+i.total,0);
  const extras=(c.extras||[]).map(e=>{
    const qt=num(q.extras[e.id]);
    const preco=e.modo==='consultar'?num(q.extrasPreco[e.id]):num(e.preco);
    return {...e,qtd:qt,precoUsado:preco,total:qt*preco,custoTotal:qt*num(e.custo)};
  });
  const contratados=extras.filter(e=>e.qtd>0);
  const receitaExtras=contratados.reduce((a,e)=>a+e.total,0);
  const custoExtras=contratados.reduce((a,e)=>a+e.custoTotal,0);
  const custo=custoItens+custoExtras;
  const sugestoes=[0.2,0.3,0.4,0.5].map(m=>({m,preco:Math.round(custoItens/(1-m))}));
  const base=q.preco.modo==='manual'?num(q.preco.manual):Math.round(custoItens/(1-num(q.preco.margem)));
  const subtotal=base+receitaExtras;
  const dp=num(q.desconto.pct)/100;
  const bruto=subtotal*(1-dp);
  const final=q.desconto.arredonda?Math.floor(bruto+1e-9):Math.round(bruto*100)/100;
  const imposto=final*num(r.imposto)/100;
  const lucro=final-custo-imposto;
  const margemReal=final>0?lucro/final:0;
  return {horas:h,sugL,litrosCha,litrosSuco,copos,itens,custoItens,extras,contratados,receitaExtras,custoExtras,custo,sugestoes,base,subtotal,dp,final,imposto,lucro,margemReal};
}

/* ============ conteúdo da proposta e do contrato ============ */
function pacote(q,c,k){
  const f=FORMATOS[q.op.formato]||FORMATOS.boom_galao;
  const g=num(q.op.galoes),b=num(q.op.bartenders),ch=k.litrosCha,su=k.litrosSuco;
  const prop=[],cont=[];
  prop.push(f.prop(g)); cont.push(...f.cont(g));
  if(ch||su){prop.push(`INSUMOS: ${qty(ch)}L de Chá Mate Original + ${qty(su)}L de Suco de Limão Natural Integral`);
    cont.push(`${nx(ch)} litros de chá mate original;`,`${nx(su)} litros de suco de limão natural integral;`);}
  if(q.op.kraft){prop.push('Copos Kraft Ecológico');cont.push('Copos kraft ecológicos;');}
  if(b){prop.push(`${b} Bartender${b>1?'s':''} para preparo do drink do Zé`);cont.push(`${nx(b)} bartender${b>1?'s':''} para preparo e serviço dos drinks;`);}
  if(q.op.vestuario){prop.push('Vestuário “Praia”');cont.push('Vestuário da equipe com temática de praia;');}
  if(q.op.transporte){prop.push('Transporte');cont.push('Transporte dos itens e da equipe necessários à ativação.');}
  (q.op.extraLinhas||'').split('\n').map(s=>s.trim()).filter(Boolean).forEach(s=>{prop.push(s);cont.push(s.replace(/[.;]+$/,'')+';');});
  k.contratados.forEach(e=>{const t=e.modo==='consultar'||e.modo==='fixo'?e.nome:`${e.nome}: ${qty(e.qtd)} ${e.un}`.trim();cont.push(t+';');});
  const fixed=cont.map((s,i)=>s.replace(/[.;]+$/,'')+(i===cont.length-1?'.':';'));
  return {prop,cont:fixed};
}
function extraLabel(e){
  if(e.modo==='consultar')return `${e.nome} (valor adicional - CONSULTAR)`;
  if(e.modo==='fixo')return `${e.nome} (+${moneyN(e.preco)})`;
  return `${e.nome} (${moneyN(e.preco)}${e.un?' / '+e.un:''})`;
}
function splitList(arr){if(arr.length<=1)return arr.join('');return arr.slice(0,-1).join(', ')+' ou '+arr[arr.length-1];}

  function para(text,{x=M,w=CW,size=10.4,lh=1.5,color=INK,bold:bl=false,ital:it=false,align='left',after=6,font}={}){
    const toks=tokens(text,bl,it);const lines=[];let cur=[],cw=0;
    const push=()=>{while(cur.length&&cur[cur.length-1].sp)cur.pop();lines.push({t:cur,w:cur.reduce((a,t)=>a+t.W,0)});cur=[];cw=0;};
    toks.forEach(t=>{
      if(t.nl){push();return;}
      t.W=W(fontFor(t),t.w,size);
      if(t.sp&&cur.length===0)return;
      if(cw+t.W>w&&!t.sp&&cur.length){push();}
      cur.push(t);cw+=t.W;});
    if(cur.length)push();
    const LH=size*lh;
    lines.forEach(L=>{
      ensure(LH);y-=size;
      let cx=align==='center'?x+(w-L.w)/2:x;
      L.t.forEach(t=>{if(!t.sp)page.drawText(t.w,{x:cx,y,size,font:fontFor(t),color:col(color)});cx+=t.W;});
      y-=LH-size;});
    y-=after;
  }
  newPage(true);
  B.forEach(b=>{
    switch(b.t){
      case 'brand':{
        const lw=kind==='c'?112:(cp?118:150),lh=lw*logo.height/logo.width;ensure(lh+20);
        page.drawImage(logo,{x:M,y:y-lh,width:lw,height:lh});
        (b.right||[]).forEach((l,i)=>{const f=i===0?bold:reg,sz=i===0?9.5:9,tw=W(f,clean(l),sz);
          page.drawText(clean(l),{x:PW-M-tw,y:y-14-i*14,size:sz,font:f,color:col(i===0?PURPLE:MUTED)});});
        y-=lh+(kind==='c'?10:(cp?8:16));break;}
      case 'title':para(b.text,{size:kind==='c'?15:21,bold:true,color:PURPLE,align:b.center?'center':'left',lh:1.2,after:4});break;
      case 'sub':para(b.text,{size:10,color:MUTED,align:b.center?'center':'left',after:10});break;
      case 'h':
        if(b.style==='c'){y-=3;ensure(40);para(b.text,{size:10.4,bold:true,color:PURPLE,after:2});}
        else{y-=cp?2:5;ensure(48);para(b.text+':',{size:12.2,bold:true,color:ORANGE,after:cp?1:3});}
        break;
      case 'p':{if(b.gap)y-=b.gap;para(b.text,{size:kind==='c'?9.2:10.4,align:b.center?'center':'left',after:kind==='c'?4:5,lh:kind==='c'?1.34:1.45});break;}
      case 'li':{
        const sz=kind==='c'?9.3:10.4;ensure(sz*1.5);
        const yy=y;page.drawText('•',{x:M+6,y:yy-sz,size:sz,font:bold,color:col(ORANGE)});
        para(b.text,{x:M+20,w:CW-20,size:sz,after:kind==='c'?1.5:(cp?0.5:2),lh:kind==='c'?1.36:(cp?1.34:1.45)});break;}
      case 'kv':{
        b.rows.forEach((r,i)=>{ensure(22);
          if(i===0)page.drawLine({start:{x:M,y},end:{x:M+CW,y},thickness:.6,color:col(LINE)});
          y-=13;
          page.drawText(clean(r[0]).toUpperCase(),{x:M,y,size:8.2,font:bold,color:col(MUTED)});
          page.drawText(clean(r[1]),{x:M+92,y,size:10.6,font:reg,color:col(INK)});
          y-=6;page.drawLine({start:{x:M,y},end:{x:M+CW,y},thickness:.6,color:col(LINE)});});
        y-=2;break;}
      case 'box':{
        const rows=b.all,H=rows.length*18+46;ensure(H+10);y-=cp?2:6;
        page.drawRectangle({x:M,y:y-H,width:CW,height:H,color:col(TINT)});
        let yy=y-12;
        rows.forEach(r=>{yy-=11;page.drawText(clean(r[0]),{x:M+14,y:yy,size:10.6,font:reg,color:col(INK)});
          const tw=W(reg,clean(r[1]),10.6);page.drawText(clean(r[1]),{x:M+CW-14-tw,y:yy,size:10.6,font:reg,color:col(INK)});yy-=7;});
        if(rows.length)page.drawLine({start:{x:M+14,y:yy+1},end:{x:M+CW-14,y:yy+1},thickness:.6,color:col(LINE)});
        yy-=22;
        page.drawText(clean(b.total[0]),{x:M+14,y:yy,size:15,font:bold,color:col(PURPLE)});
        const tt=clean(b.total[1]),tw=W(bold,tt,17);
        page.drawText(tt,{x:M+CW-14-tw,y:yy-1,size:17,font:bold,color:col(PURPLE)});
        y-=H+10;break;}
      case 'note':para(b.text,{size:9.2,color:MUTED,ital:!b.b,bold:!!b.b,after:5});break;
      case 'sign':{
        ensure(112);y-=24;
        const cw=(CW-40)/2;
        for(let r=0;r<2;r++){
          for(let c=0;c<2;c++){const it=b.items[r*2+c];const x=M+c*(cw+40);
            page.drawLine({start:{x,y},end:{x:x+cw,y},thickness:.7,color:col(INK)});
            page.drawText(clean(it[0]),{x,y:y-12,size:8.6,font:bold,color:col(INK)});
            page.drawText(clean(it[1]).slice(0,60),{x,y:y-23,size:8.2,font:reg,color:col(INK)});
            if(it[2])page.drawText(clean(it[2]).slice(0,60),{x,y:y-34,size:8.2,font:reg,color:col(INK)});}
          y-=r===0?50:0;}
        break;}
    }
  });
  const n=pages.length;
  pages.forEach((p,i)=>{
    p.drawLine({start:{x:M,y:40},end:{x:PW-M,y:40},thickness:.6,color:col(LINE)});
    p.drawText(clean(footer),{x:M,y:27,size:8,font:reg,color:col(MUTED)});
    const t=`Página ${i+1} de ${n}`,tw=W(reg,t,8);
    p.drawText(t,{x:PW-M-tw,y:27,size:8,font:reg,color:col(MUTED)});
  });
  return {bytes:await pdf.save(),pages:n};
}

/* ============ binding ============ */
function populate(root=document){
  $$('[data-bind]',root).forEach(el=>{
    const [r,p]=el.dataset.bind.split(':');const src=r==='q'?Q:C0;let v=getPath(src,p);
    if(el.type==='checkbox')el.checked=!!v;else el.value=v==null?'':v;});
}
function readEl(el){
  if(el.type==='checkbox')return el.checked;
  if(el.hasAttribute('data-num')){const s=el.value.trim();if(s==='')return null;const n=parseFloat(s);return Number.isFinite(n)?n:null;}
  if(el.tagName==='SELECT'&&el.dataset.bind.includes('.n'))return el.value;
  return el.value;
}
document.addEventListener('input',ev=>{
  const el=ev.target;if(!el.dataset||!el.dataset.bind)return;
  const [r,p]=el.dataset.bind.split(':');let v=readEl(el);
  if(r==='q'){setPath(Q,p,v);touchQ();
    if(p==='pagamento.n'){Q.pagamento.n=v;buildParcelas();populate($('#parc-list'));}
    if(p==='preco.manual'){Q.preco.modo=(v==null||v==='')?'margem':'manual';}
  }else{
    if(p.startsWith('extras.')&&/\.(modo|grupo)$/.test(p)){setPath(C0,p,v);touchC();buildExtrasList();populate($('#extras-list'));refresh();return;}
    setPath(C0,p,v);touchC();
  }
  refresh();
});
document.addEventListener('change',ev=>{const el=ev.target;if(el.dataset&&el.dataset.bind==='q:cliente.tipo'){refresh();}});

  $('#m-status').innerHTML=`<span class="pill ${Q.status}">${st}</span>`;

  $('#vol-hint').innerHTML=num(Q.evento.convidados)?`Sugestão pelo consumo: <b>${qty(C0.regras.consumoL)} L × ${num(Q.evento.convidados)} convidados × (${qty(h||C0.regras.horasBase)}h ÷ ${qty(C0.regras.horasBase)}h) = ${k.sugL} L</b>, ou seja ${Math.ceil(k.sugL/2)} L de chá + ${Math.ceil(k.sugL/2)} L de suco. Preencha os litros acima para usar outro volume.`:`Informe o número de convidados para calcular o volume automaticamente (${qty(C0.regras.consumoL)} L por adulto em ${qty(C0.regras.horasBase)}h). Duração do evento: <b>${h?qty(h)+'h':'defina início e fim'}</b>.`;

    const inp=row.querySelector('input');inp.placeholder=qty(x.def);

    row.querySelector('.u').textContent=money(x.unit);row.querySelector('.t').textContent=money(x.total);});

  $('#cost-total').textContent=money(k.custo);
  // margens
  $('#margins').innerHTML=k.sugestoes.map(s=>`<button type="button" class="mchip" data-m="${s.m}" aria-pressed="${Q.preco.modo==='margem'&&Math.abs(num(Q.preco.margem)-s.m)<1e-6}"><span>Margem ${Math.round(s.m*100)}%</span><b>${money(s.preco)}</b><span>lucro ${money(s.preco-k.custoItens)}</span></button>`).join('');
  $('#price-hint').innerHTML=`Pacote: <b>${money(k.base)}</b>${k.receitaExtras>0?` + extras <b>${money(k.receitaExtras)}</b>`:''}${k.dp>0?` − desconto de <b>${pct(k.dp)}</b>`:''} = <b>${money(k.final)}</b> ao cliente. Custo <b>${money(k.custo)}</b>${k.imposto>0?`, impostos <b>${money(k.imposto)}</b>`:''}, lucro <b>${money(k.lucro)}</b> (${k.final>0?pct(k.margemReal):'—'}).`;
  renderPreview(k);
  renderQuoteList();
}
let lastK=null;
function renderPreview(k){
  lastK=k;
  if(currentTab==='proposta'){$('#paper-prop').innerHTML=blocksHTML(buildProposal(Q,C0,k),'p');fit('prop');$('#mark-sent').disabled=Q.status!=='rascunho';}
  if(currentTab==='contrato'){
    const ok=Q.status==='aprovada';$('#gate').hidden=ok;$('#contract-body').hidden=!ok;
    if(ok){$('#paper-cont').innerHTML=blocksHTML(buildContract(Q,C0,k),'c');fit('cont');
      const miss=[];if(!Q.cliente.razao&&!Q.cliente.nome)miss.push('nome do contratante');if(!Q.cliente.doc)miss.push('CNPJ/CPF');if(!Q.cliente.endereco)miss.push('endereço');if(!Q.cliente.qualif&&Q.cliente.tipo==='PJ'&&!Q.cliente.repNome)miss.push('representante');if(!Q.evento.data)miss.push('data do evento');if(!Q.evento.local)miss.push('local do evento');if(!Q.contrato.dataAss)miss.push('data da assinatura');if(Q.pagamento.parcelas.slice(0,num(Q.pagamento.n)).some(p=>!p.data))miss.push('vencimentos');
      const ms=$('#missing');ms.hidden=!miss.length;ms.textContent=miss.length?'Faltam preencher: '+miss.join(', ')+'. Os campos vazios saem em branco no PDF.':'';}
  }
}
function fit(w){
  const box=$('#fit-'+w),paper=box.firstElementChild;const avail=box.clientWidth;if(!avail)return;
  const s=Math.min(1,avail/794);paper.style.transform=`scale(${s})`;box.style.height=Math.ceil(paper.offsetHeight*s)+'px';
}
window.addEventListener('resize',()=>{if(currentTab==='proposta')fit('prop');if(currentTab==='contrato')fit('cont');});

function showTab(t){
  currentTab=t;
  $$('.tab').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===t));
  $$('.panel').forEach(p=>p.hidden=p.id!=='p-'+t);
  try{history.replaceState(null,'','#'+t);}catch(e){}
  refresh();
}
$('#tabs').addEventListener('click',e=>{const b=e.target.closest('.tab');if(b)showTab(b.dataset.tab);});

/* ============ ações ============ */
document.addEventListener('click',async ev=>{
  const t=ev.target.closest('button');if(!t)return;
  if(t.dataset.m){Q.preco.modo='margem';Q.preco.margem=parseFloat(t.dataset.m);Q.preco.manual=null;$('#f_q_preco_manual').value='';touchQ();refresh();return;}
  if(t.dataset.rm!==undefined){C0.extras.splice(+t.dataset.rm,1);touchC();buildCatalog();populate($('#cat-list'));buildExtrasList();populate($('#extras-list'));refresh();return;}
  if(t.dataset.qid){loadQuote(t.dataset.qid);return;}
  switch(t.id){
    case 'cat-add':C0.extras.push({id:'x'+Date.now().toString(36),nome:'Novo item',grupo:'extra',modo:'un',preco:0,un:'',custo:0,curto:''});touchC();buildCatalog();populate($('#cat-list'));buildExtrasList();populate($('#extras-list'));break;
    case 'btn-new':adoptQuote(newQuote());showTab('evento');break;
    case 'btn-save':await saveNow();break;
    case 'btn-dup':{const c=clone(Q);c.id='q'+Date.now().toString(36);c.status='rascunho';c.criado=Date.now();c.cliente.nome=(c.cliente.nome||'Orçamento')+' (cópia)';adoptQuote(c);touchQ();break;}
    case 'btn-del':{
      if(!deleteArmed){deleteArmed=true;t.textContent='Confirmar exclusão';setTimeout(()=>{deleteArmed=false;t.textContent='Excluir';},3500);}
      else{deleteArmed=false;t.textContent='Excluir';await Store.deleteQuote(Q.id);const next=quotes.find(x=>x.id!==Q.id);adoptQuote(next?clone(next):newQuote());}
      break;}
    case 'pdf-prop':await downloadPDF('prop');break;
    case 'pdf-cont':await downloadPDF('cont');break;
    case 'copy-prop':copyWhats();break;
    case 'mark-sent':Q.status='enviada';touchQ();refresh();break;
    case 'approve':Q.status='aprovada';touchQ();refresh();break;
    case 'reopen':Q.status='enviada';touchQ();refresh();break;
  }
});
function adoptQuote(q){Q=q;buildParcelas();populate();refresh();setSaveState(Q.id==='exemplo-typo'&&!quotes.find(x=>x.id===Q.id)?'exemplo':'idle');}
function loadQuote(id){const q=quotes.find(x=>x.id===id);if(q){adoptQuote(deepMerge(newQuote(),clone(q)));}}

function waText(q,c,k){
  const nome=q.cliente.nome||q.evento.nome||'';const pk=pacote(q,c,k);
  const L=[`*Proposta Zé do Mate${nome?' · '+nome:''}*`,''];
  if(q.evento.data)L.push(`📅 ${dateBR(q.evento.data)}${q.evento.inicio?' · '+timeFmt(q.evento.inicio)+' às '+timeFmt(q.evento.fim):''}`);
  if(q.evento.local)L.push(`📍 ${q.evento.local}`);
  L.push('','*A ativação inclui:*',...pk.prop.map(s=>'- '+s));
  if(k.contratados.length)L.push('','*Extras contratados:*',...k.contratados.map(e=>`- ${e.nome}: ${money(e.total)}`));
  L.push('');
  if(k.dp>0)L.push(`Total: ${money(k.subtotal)}`,`Com desconto de ${pct(k.dp)}${q.desconto.rotulo?' ('+q.desconto.rotulo+')':''}: *${money(k.final)}*`);
  else L.push(`*Total: ${money(k.final)}*`);
  const ad=k.extras.filter(e=>e.grupo==='adicional');
  if(ad.length)L.push('','*Adicionais opcionais:*',...ad.map(e=>'- '+extraLabel(e)));
  if(q.proposta.obs)L.push('','_'+q.proposta.obs+'_');
  return L.join('\n');
}
function copyWhats(){
  const txt=waText(Q,C0,calc(Q,C0));$('#wa-card').hidden=false;const ta=$('#wa-text');ta.value=txt;
  const msg=$('#msg-prop');
  const fallback=()=>{ta.focus();ta.select();msg.className='msg warn';msg.textContent='Selecionei o texto abaixo. Copie com Ctrl+C.';};
  try{navigator.clipboard.writeText(txt).then(()=>{msg.className='msg ok';msg.textContent='Texto copiado.';},fallback);}catch(e){fallback();}
}
async function downloadPDF(w){
  const msg=$(w==='prop'?'#msg-prop':'#msg-cont');msg.className='msg';msg.textContent='Gerando PDF...';
  try{
    if(!window.PDFLib)throw new Error('lib');
    const k=calc(Q,C0);const nome=Q.cliente.nome||Q.evento.nome||'Cliente';
    const B=w==='prop'?buildProposal(Q,C0,k):buildContract(Q,C0,k);
    const bytes=await makePDF(B,{kind:w==='prop'?'p':'c',footer:`Zé do Mate • ${w==='prop'?'Proposta':'Contrato'} ${nome} • ${C0.empresa.instagram}`});
    const fn=`${w==='prop'?'Proposta':'Contrato'} Zé do Mate - ${fileSafe(nome)}${Q.evento.data?' - '+Q.evento.data:''}.pdf`;
    const dl=await window.claude?.use?.('downloads');
    if(!dl){msg.className='msg warn';msg.textContent='O download não está disponível neste modo de visualização.';return;}
    await dl.save({filename:fn,data:bytes});
    msg.className='msg ok';msg.textContent='PDF salvo.';
  }catch(e){
    msg.className='msg warn';
    msg.textContent=e&&e.code==='declined'?'Download cancelado.':(e&&e.message==='lib'?'Não consegui carregar o gerador de PDF. Verifique a conexão e recarregue a página.':'Não foi possível salvar o PDF.');
  }
}

/* ============ lista de orçamentos ============ */
function renderQuoteList(){
  const all=quotes.slice();
  const l=$('#qlist');
  if(!all.some(x=>x.id===Q.id)){all.unshift(Q);}
  l.innerHTML=all.map(x=>{const kk=calc(deepMerge(newQuote(),x),C0);const nm=x.cliente?.nome||x.evento?.nome||'Sem nome';
    const lbl={rascunho:'Rascunho',enviada:'Enviada',aprovada:'Aprovado'}[x.status]||'Rascunho';
    return `<button class="qitem" type="button" data-qid="${esc(x.id)}" aria-current="${x.id===Q.id}"><b>${esc(nm)}${x.id==='exemplo-typo'&&!quotes.find(y=>y.id===x.id)?' (exemplo)':''}</b><span><span>${x.evento?.data?dateBR(x.evento.data):'sem data'}</span><span class="pill ${x.status||'rascunho'}">${lbl}</span></span><span><span>${money(kk.final)}</span></span></button>`;}).join('');
  // mantém dados do orçamento aberto na lista ao vivo
}
function setSaveState(s){
  const el=$('#savestate');
  el.textContent={idle:'',dirty:'Alterações não salvas',saving:'Salvando...',saved:'Salvo',error:'Falha ao salvar',exemplo:'Exemplo, ainda não salvo'}[s]||'';
}

/* ============ armazenamento ============ */
const Store={
  db:null,mode:'local',mem:{},
  lsGet(k){try{return JSON.parse(localStorage.getItem(k));}catch(e){return null;}},
  lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true;}catch(e){return false;}},
  async init(){
    try{const d=await window.claude?.use?.('db');if(d){this.db=d;this.mode='db';}}catch(e){}
    $('#mode').textContent=this.mode==='db'?'Os orçamentos ficam guardados na conta e aparecem para quem tem acesso a esta página.':'Armazenamento só neste navegador. Para compartilhar com sócios, abra pela conta com acesso de edição.';
    if(this.mode==='db'){
      try{const s=await this.db.doc('zdm/config').get();if(s.exists)C0=deepMerge(clone(DEFAULT_CONFIG),s.data());}catch(e){}
      this.db.collection('quotes').orderBy('atualizado','desc').limit(200).onSnapshot(snap=>{quotes=snap.docs.map(d=>d.data());onQuotesChanged();},()=>{});
    }else{
      const c=this.lsGet('zdm.config');if(c)C0=deepMerge(clone(DEFAULT_CONFIG),c);
      const q=this.lsGet('zdm.quotes')||{};quotes=Object.values(q).sort((a,b)=>b.atualizado-a.atualizado);
    }
    buildExtrasList();buildCatalog();populate();onQuotesChanged();
  },
  async saveQuote(q){
    if(this.mode==='db'){await this.db.doc('quotes/'+q.id).set(JSON.parse(JSON.stringify(q)));}
    else{const all=this.lsGet('zdm.quotes')||{};all[q.id]=q;if(!this.lsSet('zdm.quotes',all))throw new Error('ls');quotes=Object.values(all).sort((a,b)=>b.atualizado-a.atualizado);onQuotesChanged();}
  },
  async deleteQuote(id){
    if(this.mode==='db'){await this.db.doc('quotes/'+id).delete();}
    else{const all=this.lsGet('zdm.quotes')||{};delete all[id];this.lsSet('zdm.quotes',all);quotes=Object.values(all);}
    quotes=quotes.filter(x=>x.id!==id);
  },
  async saveConfig(){
    if(this.mode==='db')await this.db.doc('zdm/config').set(JSON.parse(JSON.stringify(C0)));else this.lsSet('zdm.config',C0);
  }
};
let chain=Promise.resolve();
function onQuotesChanged(){renderQuoteList();}
function touchQ(){Q.atualizado=Date.now();dirty=true;setSaveState('dirty');clearTimeout(saveTimer);saveTimer=setTimeout(saveNow,1800);}
function touchC(){clearTimeout(cfgTimer);cfgTimer=setTimeout(()=>{chain=chain.then(()=>Store.saveConfig()).catch(()=>{});},1500);}
function saveNow(){
  clearTimeout(saveTimer);
  if(!dirty&&Q.id!=='exemplo-typo'&&quotes.some(x=>x.id===Q.id))return Promise.resolve();
  setSaveState('saving');
  const snap=clone(Q);
  chain=chain.then(()=>Store.saveQuote(snap)).then(()=>{if(snap.atualizado===Q.atualizado)dirty=false;setSaveState('saved');if(!quotes.some(x=>x.id===snap.id)){quotes.unshift(snap);}renderQuoteList();}).catch(()=>setSaveState('error'));
  return chain;
}

/* ============ início ============ */
Q=exampleQuote();
buildPanels();
buildExtrasList();buildCatalog();buildParcelas();populate();
const h0=(location.hash||'').replace('#','');
showTab(['evento','custos','proposta','contrato','tabelas'].includes(h0)?h0:'evento');
setSaveState('exemplo');
Store.init();
</script>
